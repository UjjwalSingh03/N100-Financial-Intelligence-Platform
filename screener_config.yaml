# Sprint 3 Day 16 — Six preset screeners
# Threshold names are interpreted by src/screener/engine.py.
# Day 21 calibration: Value Pick and Debt-Free Blue Chip were adjusted to
# satisfy the documented 5–50 result-count DoD on the validated N100 dataset.
# The changes are explicit and covered by Day 21 tests/review.

presets:
  quality_compounder:
    description: "ROE > 15%, D/E < 1, positive FCF, Revenue CAGR 5Y > 10%"
    filters:
      roe_min: 15
      de_max: 1
      fcf_min: 0
      revenue_cagr_5yr_min: 10

  value_pick:
    description: "P/E < 30, P/B < 5, D/E < 3, Dividend Yield > 0%"
    filters:
      pe_max: 30
      pb_max: 5
      de_max: 3
      dividend_yield_min: 0

  growth_accelerator:
    description: "PAT CAGR 5Y > 20%, Revenue CAGR 5Y > 15%, D/E < 2"
    filters:
      pat_cagr_5yr_min: 20
      revenue_cagr_5yr_min: 15
      de_max: 2

  dividend_champion:
    description: "Dividend Yield > 2%, Dividend Payout < 80%, positive FCF"
    filters:
      dividend_yield_min: 2
      dividend_payout_max: 80
      fcf_min: 0

  debt_free_blue_chip:
    description: "Near-zero D/E <= 0.01, ROE > 10%, Revenue > 5000 Crore"
    filters:
      de_max: 0.01
      roe_min: 10
      sales_min: 5000

  turnaround_watch:
    description: "Revenue CAGR 3Y > 10%, positive latest FCF, declining D/E YoY"
    filters:
      revenue_cagr_3yr_min: 10
      fcf_min: 0
      de_trend: declining

custom:
  filters: {}
